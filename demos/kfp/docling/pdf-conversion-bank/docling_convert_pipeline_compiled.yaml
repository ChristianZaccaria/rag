#    max_tokens: int [Default: 512.0]
#    num_workers: int [Default: 1.0]
#    pdf_filenames: str [Default: 'redbankfinancial_about.pdf, redbankfinancial_faq.pdf']
#    service_url: str [Default: 'http://ragathon-team-3-ragathon-team-3.apps.llama-rag-pool-b84hp.aws.rh-ods.com']
#    use_gpu: bool [Default: False]
#    vector_db_id: str [Default: 'red_bank_financial_kb']
